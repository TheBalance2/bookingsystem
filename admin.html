<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <meta name="description" content="Administrator and Facility-In-Charge login for the San Isidro College Digital Reservation System.">
  <title>Staff Portal Login — San Isidro College</title>
  <!-- Bootstrap 5 Grid & Utilities -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/core.css?v=8">
  <link rel="stylesheet" href="css/components.css?v=8">
  <link rel="stylesheet" href="css/admin.css?v=8">
  <link rel="stylesheet" href="css/responsive.css?v=8">
</head>
<body>

  <!-- ============================================================
       LOGIN PAGE (Vue.js 3 Reactive App)
       ============================================================ -->
  <div class="login-page d-flex align-items-center justify-content-center" id="loginApp" v-cloak>
    <div class="login-card">
      <div class="login-header text-center">
        <img src="images/logo.jpg" alt="San Isidro College Logo" width="68" height="68" class="login-logo" style="object-fit: contain;">
        <span class="login-portal-badge">Official Staff Portal</span>
        <h1>Management Sign In</h1>
        <p class="login-subtitle">Administrator &amp; Facility-In-Charge Portal</p>
      </div>

      <div class="login-error" id="loginError" role="alert" aria-live="polite" :class="{ visible: errorMessage }">
        {{ errorMessage || 'Invalid email or password. Please try again.' }}
      </div>

      <form class="login-form" id="loginForm" @submit.prevent="login" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" name="email" v-model="email" autocomplete="email" spellcheck="false" placeholder="name@sic.edu.ph" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-input-wrapper">
            <input :type="showPassword ? 'text' : 'password'" id="loginPassword" name="password" v-model="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" :title="showPassword ? 'Hide password' : 'Show password'">
              <svg v-if="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <svg v-else width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="loginBtn" :class="{ loading: loading }" :disabled="loading">
          <span v-if="loading"><span class="spinner" aria-hidden="true"></span> Signing in&hellip;</span>
          <span v-else>Sign In to Portal</span>
        </button>
      </form>

      <div class="text-center" style="margin-top:var(--space-lg);">
        <a href="index.html" class="login-back-link">
          &larr; Back to Public Reservation Site
        </a>
      </div>
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS (Firebase + Vue 3 + MVC Core, Model & Vue App)
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>

  <!-- Core & Models -->
  <script src="js/core/firebase-config.js"></script>
  <script src="js/core/logger.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/models/auth-model.js"></script>
  <script src="js/models/user-model.js"></script>
  <script src="js/models/activity-log-model.js"></script>

  <!-- Vue 3 Login App -->
  <script src="js/vue-apps/login-app.js"></script>
</body>
</html>
