<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin login for the San Isidro College Digital Reservation System.">
  <title>Admin Login — San Isidro College</title>
  <!-- Bootstrap 5 Grid & Utilities -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css?v=2">
</head>
<body>

  <!-- ============================================================
       LOGIN PAGE (Vue.js 3 Reactive App)
       ============================================================ -->
  <div class="login-page d-flex align-items-center justify-content-center" id="loginApp" v-cloak>
    <div class="login-card">
      <div class="login-header text-center">
        <img src="images/logo.jpg" alt="SIC Logo" class="login-logo" style="background: transparent; object-fit: contain;">
        <h1>Admin Portal</h1>
        <p class="login-subtitle">Sign in to manage reservations</p>
      </div>

      <div class="login-error" id="loginError" :class="{ visible: errorMessage }">
        {{ errorMessage || 'Invalid email or password. Please try again.' }}
      </div>

      <form class="login-form" id="loginForm" @submit.prevent="login" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" v-model="email" placeholder="admin@sic.edu.ph" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" v-model="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="loginBtn" :class="{ loading: loading }" :disabled="loading">
          <span v-if="loading"><span class="spinner"></span> Signing in...</span>
          <span v-else>Sign In</span>
        </button>
      </form>

      <div class="text-center" style="margin-top:var(--space-xl);">
        <a href="index.html" style="color:var(--gray-300); font-size:0.85rem;">
          ← Back to Homepage
        </a>
      </div>
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS (Firebase + Vue 3 + MVC Core, Model & Vue App)
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>

  <!-- Core & Models -->
  <script src="js/core/firebase-config.js"></script>
  <script src="js/core/logger.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/models/auth-model.js"></script>

  <!-- Vue 3 Login App -->
  <script src="js/vue-apps/login-app.js"></script>
</body>
</html>
